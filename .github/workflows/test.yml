name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # Pinned: "ubuntu-latest" moved to Ubuntu 26.04, which Playwright 1.56 cannot install Chromium on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/screenshots/
